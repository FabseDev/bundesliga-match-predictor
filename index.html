<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bundesliga Match Predictor</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* Dark / Elegant theme integrated directly into index.html
           Accent: Gold (#D4AF37) for a classy touch
        */
        :root{
          --bg: #070708;
          --surface: #0e0f11;
          --muted: #9aa3ad;
          --text: #e6e7e9;
          --accent: #D4AF37;
          --accent-2: #b99a2b;
          --glass: rgba(255,255,255,0.03);
          --card-shadow: 0 8px 28px rgba(0,0,0,0.6);
          --input-shadow: 0 6px 18px rgba(0,0,0,0.5);
          --radius: 12px;
          --radius-sm: 8px;
          --transition: 180ms cubic-bezier(.2,.9,.3,1);
        }

        * { box-sizing: border-box; }
        html,body,#root { height: 100%; }
        body {
          margin: 0;
          font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
          background: linear-gradient(180deg, var(--bg) 0%, #060606 60%);
          color: var(--text);
          -webkit-font-smoothing:antialiased;
          -moz-osx-font-smoothing:grayscale;
          line-height: 1.45;
        }

        .container {
          max-width: 1100px;
          margin: 36px auto;
          padding: 24px;
        }

        /* Header Card (was .header) */
        .header {
          background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
          padding: 28px 22px;
          border-radius: calc(var(--radius) + 4px);
          box-shadow: var(--card-shadow);
          margin-bottom: 36px;
          display:flex;
          align-items:center;
          justify-content:space-between;
          gap:16px;
        }

        .header-content {
          display:flex;
          align-items:center;
          gap:16px;
        }

        .brand-logo {
          width:48px;
          height:48px;
          border-radius:8px;
          background: linear-gradient(180deg, rgba(212,175,55,0.12), rgba(212,175,55,0.04));
          display:flex;
          align-items:center;
          justify-content:center;
          color:var(--accent);
          font-weight:700;
          font-family: "Playfair Display", serif;
        }

        .header h1 {
          font-family: "Playfair Display", serif;
          font-size: 22px;
          letter-spacing: -0.4px;
          color: var(--text);
          margin:0;
        }

        .subtitle {
          color: var(--muted);
          font-size: 0.95em;
        }

        /* Section wrapper to make transitions clearer */
        .section-card {
          background: linear-gradient(180deg, rgba(255,255,255,0.01), transparent);
          padding: 16px;
          border-radius: 12px;
          border: 1px solid rgba(255,255,255,0.03);
          box-shadow: 0 6px 20px rgba(0,0,0,0.5);
          margin-bottom: 18px;
        }

        /* Small visual separator between sections for clearer transitions */
        .section-separator {
          height: 1px;
          background: linear-gradient(90deg, rgba(255,255,255,0.00), rgba(255,255,255,0.03), rgba(255,255,255,0.00));
          margin: 18px 0;
        }

        /* Stats Section */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 18px; }
        .stat-card {
          background: linear-gradient(180deg, rgba(255,255,255,0.01), transparent);
          padding: 16px;
          border-radius: 12px;
          box-shadow: var(--card-shadow);
          text-align: center;
          border: 1px solid rgba(255,255,255,0.03);
        }
        .stat-value { font-size: 1.6em; font-weight:700; color:var(--accent); margin:8px 0; }
        .stat-label { color: var(--muted); font-size: 0.9em; }

        /* Filters Section */
        .filter-buttons { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
        .filter-btn {
          background: transparent;
          border: 1px solid rgba(255,255,255,0.04);
          color: var(--muted);
          padding: 10px 18px;
          border-radius: 999px;
          cursor:pointer;
          transition: all var(--transition);
          font-weight:600;
        }
        .filter-btn.active {
          background: linear-gradient(180deg, rgba(212,175,55,0.12), rgba(212,175,55,0.06));
          color: var(--accent);
          border-color: rgba(212,175,55,0.14);
          box-shadow: 0 8px 30px rgba(212,175,55,0.04);
          transform: translateY(-2px);
        }

        /* Matches Section */
        .matches-container { display:grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap:18px; }
        .match-card {
          background: linear-gradient(180deg, rgba(255,255,255,0.015), rgba(255,255,255,0.01));
          border-radius: 12px;
          overflow: hidden;
          box-shadow: var(--card-shadow);
          transition: transform var(--transition), box-shadow var(--transition);
          border: 1px solid rgba(255,255,255,0.03);
        }
        .match-card:hover { transform: translateY(-6px); box-shadow: 0 20px 50px rgba(0,0,0,0.6); }

        .match-header {
          padding: 12px 16px;
          display:flex;
          align-items:center;
          justify-content:space-between;
          gap:8px;
          background: linear-gradient(90deg, rgba(255,255,255,0.01), transparent);
        }
        .match-date { color: var(--muted); font-size: 0.9em; }
        .match-time { color: var(--muted); font-size: 0.85em; }

        .match-body { padding: 18px; }
        .teams-container { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; }
        .team { flex:1; text-align:center; }
        .team-name { font-weight:700; color:var(--text); font-size:0.95em; margin-bottom:8px; }
        .team-score { font-size:1.8em; font-weight:800; color:var(--text); }
        .vs-text { font-size:1.2em; color:var(--muted); margin: 0 10px; font-weight:700; }

        .prediction-section { background: rgba(255,255,255,0.01); padding:14px; border-radius:10px; margin-top:8px; border:1px solid rgba(255,255,255,0.02); }
        .prediction-label { color:var(--muted); font-size:0.8em; text-transform:uppercase; margin-bottom:6px; }
        .prediction-value { font-size:1.4em; font-weight:800; color:var(--accent); margin-bottom:8px; }

        .confidence-bar { background: rgba(255,255,255,0.03); height:8px; border-radius:999px; overflow:hidden; }
        .confidence-fill { height:100%; background: linear-gradient(90deg, #ff6b6b, var(--accent), #4caf50); transition: width 0.4s ease; }
        .confidence-text { color:var(--muted); font-size:0.85em; text-align:right; margin-top:6px; }

        .confidence-badge { display:inline-block; padding:6px 12px; border-radius:999px; font-size:0.85em; font-weight:700; margin-top:10px; }
        .confidence-high { background: rgba(76,175,80,0.08); color:#7FFFD4; }
        .confidence-medium { background: rgba(212,175,55,0.08); color:var(--accent); }
        .confidence-low { background: rgba(244,67,54,0.06); color:#ff7b7b; }

        /* Footer */
        .footer { text-align:center; color:var(--muted); font-size:13px; margin-top:28px; }

        /* Responsive */
        @media (max-width:800px){
          .teams-container { flex-direction:column; align-items:stretch; gap:8px; }
          .matches-container { grid-template-columns: 1fr; }
          .header { flex-direction:column; align-items:stretch; gap:12px; }
          .header h1 { font-size:20px; }
        }

        /* small helpers */
        .muted { color: var(--muted); }

    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="brand-logo">BM</div>
                <div>
                    <h1>Bundesliga Match Predictor</h1>
                    <div class="subtitle">Vorhersagen für den kommenden Spieltag</div>
                </div>
            </div>
            <div class="controls">
                <!-- Placeholder for future controls (theme toggle, settings) -->
                <div class="small muted">Edles Dark‑Theme aktiv</div>
            </div>
        </header>

        <!-- Stats Section -->
        <section class="stats-section section-card">
            <div class="stats-grid" id="statsContainer">
                <div class="stat-card">
                    <div class="stat-label">Spiele im Spieltag</div>
                    <div class="stat-value" id="totalMatches">6</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Durchschn. Konfidenz</div>
                    <div class="stat-value" id="avgConfidence">76%</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Vorhersagen korrekt</div>
                    <div class="stat-value" id="correctPredictions">5/6</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Genauigkeitsrate</div>
                    <div class="stat-value" id="accuracyRate">75%</div>
                </div>
            </div>
        </section>

        <div class="section-separator" aria-hidden="true"></div>

        <!-- Filters -->
        <section class="filters-section section-card">
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">Alle Spiele</button>
                <button class="filter-btn" data-filter="high">Hohe Konfidenz (&gt;80%)</button>
                <button class="filter-btn" data-filter="medium">Mittlere Konfidenz (60-80%)</button>
                <button class="filter-btn" data-filter="low">Niedrige Konfidenz (&lt;60%)</button>
            </div>
        </section>

        <div class="section-separator" aria-hidden="true"></div>

        <!-- Matches Section -->
        <section class="matches-section section-card">
            <div class="matches-container" id="matchesContainer">
                <!-- Dynamisch gefüllt -->
            </div>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <p>&copy; 2024 Bundesliga Match Predictor | Alle Vorhersagen basieren auf statistischen Modellen</p>
        </footer>
    </div>

    <script>
        // Mock Daten
        const matches = [
            {
                id: 1,
                matchday: 1,
                homeTeam: 'FC Bayern München',
                awayTeam: 'VfL Wolfsburg',
                homeScore: 3,
                awayScore: 1,
                prediction: '3:1',
                confidence: 0.85,
                date: '2024-09-14',
                time: '15:30'
            },
            {
                id: 2,
                matchday: 1,
                homeTeam: 'Borussia Dortmund',
                awayTeam: 'Eintracht Frankfurt',
                homeScore: 2,
                awayScore: 1,
                prediction: '2:1',
                confidence: 0.78,
                date: '2024-09-14',
                time: '15:30'
            },
            {
                id: 3,
                matchday: 1,
                homeTeam: 'RB Leipzig',
                awayTeam: '1. FC Köln',
                homeScore: 3,
                awayScore: 0,
                prediction: '3:0',
                confidence: 0.82,
                date: '2024-09-14',
                time: '15:30'
            },
            {
                id: 4,
                matchday: 1,
                homeTeam: 'Bayer Leverkusen',
                awayTeam: 'Mainz 05',
                homeScore: 2,
                awayScore: 0,
                prediction: '2:0',
                confidence: 0.80,
                date: '2024-09-14',
                time: '15:30'
            },
            {
                id: 5,
                matchday: 1,
                homeTeam: 'SC Freiburg',
                awayTeam: 'Hoffenheim',
                homeScore: 1,
                awayScore: 1,
                prediction: '1:1',
                confidence: 0.70,
                date: '2024-09-15',
                time: '15:30'
            },
            {
                id: 6,
                matchday: 1,
                homeTeam: 'Union Berlin',
                awayTeam: 'Borussia Mönchengladbach',
                homeScore: 1,
                awayScore: 2,
                prediction: '1:2',
                confidence: 0.65,
                date: '2024-09-15',
                time: '15:30'
            }
        ];

        let currentFilter = 'all';

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            displayMatches(matches);
            updateStats();
            setupFilters();
        });

        // Setup filter buttons
        function setupFilters() {
            const filterButtons = document.querySelectorAll('.filter-btn');
            filterButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    filterButtons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = btn.dataset.filter;
                    displayMatches(filterMatches(matches));
                });
            });
        }

        // Filter matches
        function filterMatches(m) {
            switch(currentFilter) {
                case 'high':
                    return m.filter(x => x.confidence > 0.80);
                case 'medium':
                    return m.filter(x => x.confidence >= 0.60 && x.confidence <= 0.80);
                case 'low':
                    return m.filter(x => x.confidence < 0.60);
                default:
                    return m;
            }
        }

        // Update stats
        function updateStats() {
            const avg = (matches.reduce((sum, m) => sum + m.confidence, 0) / matches.length * 100).toFixed(0);
            document.getElementById('totalMatches').textContent = matches.length;
            document.getElementById('avgConfidence').textContent = avg + '%';
            document.getElementById('correctPredictions').textContent = '5/' + matches.length;
            document.getElementById('accuracyRate').textContent = '75%';
        }

        // Display matches
        function displayMatches(m) {
            const container = document.getElementById('matchesContainer');
            container.innerHTML = m.map(match => {
                const conf = (match.confidence * 100).toFixed(0);
                const confClass = match.confidence > 0.80 ? 'high' : (match.confidence >= 0.60 ? 'medium' : 'low');
                const label = match.confidence > 0.80 ? 'Hohe Konfidenz' : (match.confidence >= 0.60 ? 'Mittlere Konfidenz' : 'Niedrige Konfidenz');
                
                return `
                    <div class="match-card">
                        <div class="match-header">
                            <div>
                                <div class="match-date">Spieltag ${match.matchday}</div>
                                <div class="match-time">${match.date} · ${match.time} Uhr</div>
                            </div>
                            <div class="muted">${label}</div>
                        </div>
                        <div class="match-body">
                            <div class="teams-container">
                                <div class="team">
                                    <div class="team-name">${match.homeTeam}</div>
                                    <div class="team-score">${match.homeScore}</div>
                                </div>
                                <div class="vs-text">:</div>
                                <div class="team">
                                    <div class="team-name">${match.awayTeam}</div>
                                    <div class="team-score">${match.awayScore}</div>
                                </div>
                            </div>
                            <div class="prediction-section">
                                <div class="prediction-label">Vorhersage</div>
                                <div class="prediction-value">${match.prediction}</div>
                                <div class="confidence-bar">
                                    <div class="confidence-fill" style="width: ${conf}%"></div>
                                </div>
                                <div class="confidence-text">Konfidenz: ${conf}%</div>
                                <span class="confidence-badge confidence-${confClass}">${conf}%</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
