<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bundesliga Match Predictor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #d00;
            --secondary-color: #333;
            --accent-color: #ffd700;
            --bg-light: #f5f5f5;
            --bg-white: #ffffff;
            --text-dark: #1a1a1a;
            --text-light: #666;
            --border-color: #ddd;
            --success: #4caf50;
            --warning: #ff9800;
            --danger: #f44336;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: var(--text-dark);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        .header {
            background: var(--bg-white);
            padding: 40px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--text-light);
            font-size: 1.1em;
        }

        /* Stats Section */
        .stats-section {
            margin-bottom: 30px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .stat-card {
            background: var(--bg-white);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: var(--primary-color);
            margin: 10px 0;
        }

        .stat-label {
            color: var(--text-light);
            font-size: 0.9em;
        }

        /* Filters Section */
        .filters-section {
            margin-bottom: 30px;
        }

        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .filter-btn {
            background: var(--bg-white);
            border: 2px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            color: var(--text-dark);
        }

        .filter-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .filter-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        /* Matches Section */
        .matches-section {
            margin-bottom: 30px;
        }

        .matches-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .match-card {
            background: var(--bg-white);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .match-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.15);
        }

        .match-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            font-size: 0.9em;
        }

        .match-date {
            font-weight: bold;
        }

        .match-time {
            opacity: 0.9;
            font-size: 0.85em;
        }

        .match-body {
            padding: 20px;
        }

        .teams-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .team {
            flex: 1;
            text-align: center;
        }

        .team-name {
            font-weight: bold;
            color: var(--text-dark);
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        .team-score {
            font-size: 2em;
            font-weight: bold;
            color: var(--primary-color);
        }

        .vs-text {
            font-size: 1.2em;
            color: var(--text-light);
            margin: 0 10px;
            font-weight: bold;
        }

        .prediction-section {
            background: var(--bg-light);
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .prediction-label {
            color: var(--text-light);
            font-size: 0.85em;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .prediction-value {
            font-size: 1.5em;
            font-weight: bold;
            color: var(--text-dark);
            margin-bottom: 10px;
        }

        .confidence-bar {
            background: #e0e0e0;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
        }

        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff6b6b, #ffd700, #4caf50);
            transition: width 0.3s ease;
        }

        .confidence-text {
            font-size: 0.8em;
            color: var(--text-light);
            margin-top: 5px;
            text-align: right;
        }

        .confidence-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
            margin-top: 10px;
        }

        .confidence-high {
            background: rgba(76, 175, 80, 0.2);
            color: var(--success);
        }

        .confidence-medium {
            background: rgba(255, 152, 0, 0.2);
            color: var(--warning);
        }

        .confidence-low {
            background: rgba(244, 67, 54, 0.2);
            color: var(--danger);
        }

        /* Footer */
        .footer {
            background: var(--bg-white);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            color: var(--text-light);
            font-size: 0.9em;
            margin-top: 30px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .matches-container {
                grid-template-columns: 1fr;
            }

            .filter-buttons {
                gap: 8px;
            }

            .filter-btn {
                padding: 8px 16px;
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1>⚽ Bundesliga Match Predictor</h1>
                <p class="subtitle">Vorhersagen für den kommenden Spieltag</p>
            </div>
        </header>

        <!-- Stats Section -->
        <section class="stats-section">
            <div class="stats-grid" id="statsContainer">
                <div class="stat-card">
                    <div class="stat-label">Spiele im Spieltag</div>
                    <div class="stat-value" id="totalMatches">6</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Durchschn. Konfidenz</div>
                    <div class="stat-value" id="avgConfidence">76%</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Vorhersagen korrekt</div>
                    <div class="stat-value" id="correctPredictions">5/6</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Genauigkeitsrate</div>
                    <div class="stat-value" id="accuracyRate">75%</div>
                </div>
            </div>
        </section>

        <!-- Filters -->
        <section class="filters-section">
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">Alle Spiele</button>
                <button class="filter-btn" data-filter="high">Hohe Konfidenz (>80%)</button>
                <button class="filter-btn" data-filter="medium">Mittlere Konfidenz (60-80%)</button>
                <button class="filter-btn" data-filter="low">Niedrige Konfidenz (<60%)</button>
            </div>
        </section>

        <!-- Matches Section -->
        <section class="matches-section">
            <div class="matches-container" id="matchesContainer">
                <!-- Dynamisch gefüllt -->
            </div>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <p>&copy; 2024 Bundesliga Match Predictor | Alle Vorhersagen basieren auf statistischen Modellen</p>
        </footer>
    </div>

    <script>
        // Mock Daten
        const matches = [
            {
                id: 1,
                matchday: 1,
                homeTeam: 'FC Bayern München',
                awayTeam: 'VfL Wolfsburg',
                homeScore: 3,
                awayScore: 1,
                prediction: '3:1',
                confidence: 0.85,
                date: '2024-09-14',
                time: '15:30'
            },
            {
                id: 2,
                matchday: 1,
                homeTeam: 'Borussia Dortmund',
                awayTeam: 'Eintracht Frankfurt',
                homeScore: 2,
                awayScore: 1,
                prediction: '2:1',
                confidence: 0.78,
                date: '2024-09-14',
                time: '15:30'
            },
            {
                id: 3,
                matchday: 1,
                homeTeam: 'RB Leipzig',
                awayTeam: '1. FC Köln',
                homeScore: 3,
                awayScore: 0,
                prediction: '3:0',
                confidence: 0.82,
                date: '2024-09-14',
                time: '15:30'
            },
            {
                id: 4,
                matchday: 1,
                homeTeam: 'Bayer Leverkusen',
                awayTeam: 'Mainz 05',
                homeScore: 2,
                awayScore: 0,
                prediction: '2:0',
                confidence: 0.80,
                date: '2024-09-14',
                time: '15:30'
            },
            {
                id: 5,
                matchday: 1,
                homeTeam: 'SC Freiburg',
                awayTeam: 'Hoffenheim',
                homeScore: 1,
                awayScore: 1,
                prediction: '1:1',
                confidence: 0.70,
                date: '2024-09-15',
                time: '15:30'
            },
            {
                id: 6,
                matchday: 1,
                homeTeam: 'Union Berlin',
                awayTeam: 'Borussia Mönchengladbach',
                homeScore: 1,
                awayScore: 2,
                prediction: '1:2',
                confidence: 0.65,
                date: '2024-09-15',
                time: '15:30'
            }
        ];

        let currentFilter = 'all';

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            displayMatches(matches);
            updateStats();
            setupFilters();
        });

        // Setup filter buttons
        function setupFilters() {
            const filterButtons = document.querySelectorAll('.filter-btn');
            filterButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    filterButtons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = btn.dataset.filter;
                    displayMatches(filterMatches(matches));
                });
            });
        }

        // Filter matches
        function filterMatches(m) {
            switch(currentFilter) {
                case 'high':
                    return m.filter(x => x.confidence > 0.80);
                case 'medium':
                    return m.filter(x => x.confidence >= 0.60 && x.confidence <= 0.80);
                case 'low':
                    return m.filter(x => x.confidence < 0.60);
                default:
                    return m;
            }
        }

        // Update stats
        function updateStats() {
            const avg = (matches.reduce((sum, m) => sum + m.confidence, 0) / matches.length * 100).toFixed(0);
            document.getElementById('totalMatches').textContent = matches.length;
            document.getElementById('avgConfidence').textContent = avg + '%';
            document.getElementById('correctPredictions').textContent = '5/' + matches.length;
            document.getElementById('accuracyRate').textContent = '75%';
        }

        // Display matches
        function displayMatches(m) {
            const container = document.getElementById('matchesContainer');
            container.innerHTML = m.map(match => {
                const conf = (match.confidence * 100).toFixed(0);
                const confClass = match.confidence > 0.80 ? 'high' : (match.confidence >= 0.60 ? 'medium' : 'low');
                const label = match.confidence > 0.80 ? '🟢 Hohe Konfidenz' : (match.confidence >= 0.60 ? '🟡 Mittlere Konfidenz' : '🔴 Niedrige Konfidenz');
                
                return `
                    <div class="match-card">
                        <div class="match-header">
                            <div class="match-date">Spieltag ${match.matchday}</div>
                            <div class="match-time">${match.date} um ${match.time} Uhr</div>
                        </div>
                        <div class="match-body">
                            <div class="teams-container">
                                <div class="team">
                                    <div class="team-name">${match.homeTeam}</div>
                                    <div class="team-score">${match.homeScore}</div>
                                </div>
                                <div class="vs-text">:</div>
                                <div class="team">
                                    <div class="team-name">${match.awayTeam}</div>
                                    <div class="team-score">${match.awayScore}</div>
                                </div>
                            </div>
                            <div class="prediction-section">
                                <div class="prediction-label">Vorhersage</div>
                                <div class="prediction-value">${match.prediction}</div>
                                <div class="confidence-bar">
                                    <div class="confidence-fill" style="width: ${conf}%"></div>
                                </div>
                                <div class="confidence-text">Konfidenz: ${conf}%</div>
                                <span class="confidence-badge confidence-${confClass}">${label}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
